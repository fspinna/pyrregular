[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "pyrregular/_version.py"

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
norecursedirs = ["tests/_deprecated"]
markers = [
    "network: downloads datasets from Hugging Face",
    "models: needs the model libraries (pyrregular[models])",
]
